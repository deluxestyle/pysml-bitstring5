[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "pysml-bitstring5"
description = "Fork of pysml (EDL21 smart meters, Smart Message Language) ported to bitstring 5"
license = "MIT"
version = "0.1.9"
readme = "README.md"
authors = [{name = "Andreas Oberritter", email = "obi@saftware.de"}]
requires-python = '>=3.11,<4.0'
dependencies = ['bitstring (>=5.0.0)', 'serialx (>=1.8.0)', 'aiohttp (>=3.8.4,<4.0.0)']

[project.urls]
source = "https://codeberg.org/obi/pysml"
upstream = "https://codeberg.org/obi/pysml"
issues = "https://codeberg.org/obi/pysml/issues"

[tool.poetry]
packages = [
    { include = "sml" },
    { include = "sml-mqtt-bridge.py", from = "examples" },
    { include = "sml-mqtt-bridge.service", from = "examples" },
    { include = "test_asyncio.py", from = "examples" },
]
